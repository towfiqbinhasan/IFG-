<!doctype html>
<!--
  Offline fallback for the Android app. Capacitor shows this page only when
  the remote web app (server.url in capacitor.config.ts) cannot be loaded.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lab Paper Tracker</title>
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --primary: #2a78d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --primary: #3987e5; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      img { width: 72px; height: 72px; }
      p { color: var(--muted); max-width: 320px; margin: 8px auto 20px; line-height: 1.5; }
      button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>Lab Paper Tracker needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
